name: Compilar mod
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Permissao do gradlew
        run: chmod +x gradlew
      - name: Compilar
        run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: O-Vigia-mod
          path: build/libs/*.jar
